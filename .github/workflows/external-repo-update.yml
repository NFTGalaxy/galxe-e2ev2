name: Run pnpm scripts when external repo updates

on:
  # 使用 repository_dispatch 事件，由“另一个仓库”来主动触发本仓库的 workflow
  # 典型做法是在另一个仓库的 GitHub Action 里，调用 GitHub API 发送 repository_dispatch 事件。
  repository_dispatch:
    types:
      - upstream_updated

jobs:
  run-pnpm-scripts:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出当前仓库代码
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 版本，并启用 pnpm 缓存
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装 pnpm（避免 "Unable to locate executable file: pnpm" 错误）
      - name: Install pnpm
        id: install-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      # 4. 安装依赖
      - name: Install dependencies
        id: install-deps
        run: pnpm install

      # 5. 安装 Playwright 浏览器（包含系统依赖）
      - name: Install Playwright browsers
        id: install-playwright
        run: pnpm exec playwright install

      # 6. 构建 wallet cache（headless 模式）
      - name: Build wallet cache (headless)
        id: build-cache
        run: pnpm run build:cache:headless

      # 7. 运行 Playwright 测试（headless 模式）
      # 如果需要在 headed 模式下运行，可以使用 xvfb-run 包装命令：
      # run: xvfb-run -a pnpm run test:playwright:headful
      - name: Run Playwright tests (headless)
        env:
          ARGS: ${{ github.event.client_payload.args || 'e2e' }}
        run: pnpm run $ARGS
        continue-on-error: true # 即使测试失败也继续执行，以便上传截图和视频


      # 8. 上传测试结果（包含截图、视频和 trace 文件）
      - name: Upload test results
        if: always() # 无论测试成功或失败都上传
        uses: actions/upload-artifact@v4
        id: upload-artifact
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 3 # 保留 30 天
          if-no-files-found: ignore # 如果没有文件也不报错

